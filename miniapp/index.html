<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>ClearBank</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--tx:#f5f5f7;--mu:#8e8e93;--g:rgba(255,255,255,.06);--b:rgba(255,255,255,.14)}*{box-sizing:border-box}html,body{margin:0;width:100%;overflow-x:hidden}
body{background:#000 radial-gradient(60% 38% at 50% -4%,rgba(255,255,255,.12),transparent 70%) no-repeat;color:var(--tx);font:16px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:max(20px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom))}
main{max-width:480px;margin:0 auto;animation:in .3s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:28px;letter-spacing:-.8px;margin:6px 0 6px}.brand{font-weight:800;letter-spacing:-.5px;font-size:20px}.brand span{opacity:.55}.mu{color:var(--mu);font-size:14px}.hidden{display:none!important}
label.l{display:block;margin:20px 0 8px;font-size:13px;color:var(--mu)}input[type=text],textarea{width:100%;font:inherit;color:var(--tx);background:var(--g);border:1px solid var(--b);border-radius:14px;padding:14px;backdrop-filter:blur(20px)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip,.opt{background:var(--g);border:1px solid var(--b);color:var(--tx);border-radius:999px;padding:10px 14px;font:inherit;cursor:pointer;transition:.15s}.chip.on{background:#fff;color:#000}.chip:active,.opt:active,.btn:active{transform:scale(.97)}
.opt{display:flex;width:100%;border-radius:16px;margin:7px 0;text-align:left;align-items:center;gap:10px}.opt i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--mu);flex:none}.opt.on{border-color:#fff;box-shadow:0 0 18px rgba(255,255,255,.18)}.opt.on i{background:#fff;border-color:#fff}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:16px;font:inherit;font-weight:700;background:#fff;color:#000;margin:14px 0;cursor:pointer;box-shadow:0 0 26px rgba(255,255,255,.2);transition:.15s}.btn.g{background:var(--g);color:var(--tx);border:1px solid var(--b);box-shadow:none}.btn[disabled]{opacity:.45}
.ck{display:flex;gap:10px;align-items:flex-start;margin:18px 0;font-size:13px;color:var(--mu)}.ck input{margin-top:3px;width:18px;height:18px}.err{color:#ff667b;font-size:13px;min-height:18px}
</style></head><body><main>
<section id="form"><div class="brand">Clear<span>Bank</span></div><h1>Анкета</h1><p class="mu">Три коротких вопроса, чтобы следить за развитием проекта. ClearBank пока прототип, а не банк.</p>
<label class="l" for="name">Как к вам обращаться?</label><input id="name" type="text" maxlength="40" placeholder="Имя" autocomplete="given-name">
<label class="l">Что вам интересно? (необязательно)</label><div class="chips" id="ints"></div>
<label class="l">Откуда вы узнали о ClearBank?</label><div id="srcs"></div>
<textarea id="other" class="hidden" rows="3" maxlength="200" placeholder="Напишите свой ответ"></textarea>
<label class="ck"><input id="consent" type="checkbox"><span>Согласен(на) на обработку имени, Telegram-аккаунта и ответов анкеты для связи по проекту ClearBank. Ответы можно удалить командой /delete в боте.</span></label>
<div class="err" id="err"></div><button class="btn" id="send">Отправить анкету</button></section>
<section id="links" class="hidden"><div class="brand">Clear<span>Bank</span></div><h1>Сайт и приложение</h1><p class="mu">Здесь можно познакомиться с проектом и скачать приложение, когда оно будет готово.</p>
<button class="btn" id="site">Официальный сайт</button><button class="btn g" data-os="Android">Скачать для Android</button><button class="btn g" data-os="iOS">Скачать для iOS</button></section>
</main><script>
const SITE_URL="",SRC=[["friend","От друга"],["public","Из пабликов"],["blogger","У блогеров"],["other","Свой ответ"]],INT=[["transfers","Переводы"],["multicurrency","Мультивалютность"],["analytics","Аналитика"],["assistant","ИИ-помощник"],["qr","Оплата по QR"]];
const tg=window.Telegram&&Telegram.WebApp,$=i=>document.getElementById(i);let src=null,ints=new Set();
try{tg&&(tg.ready(),tg.expand(),tg.setHeaderColor&&tg.setHeaderColor('#000000'),tg.setBackgroundColor&&tg.setBackgroundColor('#000000'))}catch(e){}
INT.forEach(([k,t])=>{const b=document.createElement('button');b.className='chip';b.type='button';b.textContent=t;b.onclick=()=>{ints.has(k)?ints.delete(k):ints.add(k);b.classList.toggle('on')};$('ints').append(b)});
SRC.forEach(([k,t])=>{const b=document.createElement('button');b.className='opt';b.type='button';b.innerHTML='<i></i>'+t;b.onclick=()=>{src=k;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('other').classList.toggle('hidden',k!=='other');k==='other'&&$('other').focus()};$('srcs').append(b)});
const note=m=>tg&&tg.showAlert?tg.showAlert(m):alert(m);
$('send').onclick=()=>{const name=$('name').value.trim(),o=$('other').value.trim();let e='';
if(!name)e='Введите имя.';else if(!src)e='Выберите, откуда вы узнали о ClearBank.';else if(src==='other'&&!o)e='Напишите свой ответ.';else if(!$('consent').checked)e='Нужно согласие на обработку данных.';
$('err').textContent=e;if(e)return;const d={name,interests:[...ints],source:src,source_text:src==='other'?o:'',consent:true};
if(tg&&tg.initData){tg.sendData(JSON.stringify(d))}else{$('err').textContent='Тестовый режим (вне Telegram): '+JSON.stringify(d)}};
$('site').onclick=()=>{if(!SITE_URL)return note('Сайт скоро появится.');tg&&tg.openLink?tg.openLink(SITE_URL):window.open(SITE_URL)};
document.querySelectorAll('[data-os]').forEach(b=>b.onclick=()=>note('Версия для '+b.dataset.os+' пока в работе. Мы сообщим о запуске.'));
if(new URLSearchParams(location.search).get('screen')==='links'){$('form').classList.add('hidden');$('links').classList.remove('hidden')}
</script></body></html>
